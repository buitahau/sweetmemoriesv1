name: Deploy dev

on:
  push:
    branches: [dev-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Write web markers
        run: |
          node -e "require('fs').writeFileSync('apps/web/dist/version.json', JSON.stringify({ commit: process.env.GITHUB_SHA }))"
          printf '/*\n  X-Robots-Tag: noindex\n/version.json\n  Cache-Control: no-store\n' > apps/web/dist/_headers
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy API
        run: npm run deploy:dev -w apps/api -- --var GIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy web
        run: npm run deploy:dev -w apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait for dev deploy
        run: WAIT_TIMEOUT_SECONDS=180 scripts/wait-for-dev-deploy.sh "$GITHUB_SHA"
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
      - name: Smoke test dev
        run: scripts/smoke-dev.sh
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
