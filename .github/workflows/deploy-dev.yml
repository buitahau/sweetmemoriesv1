name: deploy-dev

# Deploys the head of dev-v2 to the dev Worker. Secrets live in the GitHub
# Environment `dev` (limited to dev-v2). PR code never reaches this workflow.
on:
  push:
    branches: [dev-v2]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; newer runs queue behind the running one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    # workflow_dispatch can pick any ref; only dev-v2 may deploy.
    if: github.ref == 'refs/heads/dev-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks below must stay identical to ci.yml (enforced by src/ci/deploy-dev.test.ts).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A re-run reuses the original github.sha. Refuse to deploy an older commit over a newer one.
      - name: Refuse stale run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/commits/dev-v2" --jq .sha)
          if [ "$HEAD_SHA" != "$SHA" ]; then
            echo "stale run, use workflow_dispatch (run $SHA, dev-v2 is at $HEAD_SHA)" >&2
            exit 1
          fi
      - name: Deploy to dev
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.jsonc --env dev --tag ${{ github.sha }} --message "deploy-dev ${{ github.sha }}"
      - name: Smoke check /api/health
        id: smoke
        env:
          # Fall back to the Environment variable if wrangler-action cannot parse the URL.
          DEV_URL: ${{ steps.deploy.outputs.deployment-url || vars.DEV_URL }}
        run: node src/ci/smoke-health.ts "$DEV_URL"
      - name: Roll back dev after failed smoke check
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback -c wrangler.jsonc --env dev --message "auto-rollback after failed smoke check ${{ github.sha }}" --yes
      # Written last so the outcome reflects the smoke check and any rollback.
      - name: Job summary
        if: always() && steps.deploy.outcome == 'success'
        env:
          SHA: ${{ github.sha }}
          DEV_URL: ${{ steps.deploy.outputs.deployment-url || vars.DEV_URL }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          VERSION_ID=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Current Version ID: *\([0-9a-fA-F-]\{36\}\).*/\1/p' | head -n1)
          if [ "$SMOKE" = "success" ]; then OUTCOME="deployed, smoke check passed"
          elif [ "$ROLLBACK" = "success" ]; then OUTCOME="ROLLED BACK after failed smoke check; this commit is NOT live"
          else OUTCOME="smoke check $SMOKE, rollback $ROLLBACK; check dev manually"; fi
          {
            echo "## deploy-dev"
            echo "- Outcome: $OUTCOME"
            echo "- Commit: \`$SHA\`"
            echo "- Dev URL: $DEV_URL"
            echo "- Cloudflare version ID: \`${VERSION_ID:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
